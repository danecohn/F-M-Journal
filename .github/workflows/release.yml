name: Six-platform desktop release
on:
  push:
    branches: [main]
    paths: ['index.html', 'vite.config.mjs', 'desktop/**', 'src/**', 'public/**', 'server/**', 'package*.json', 'scripts/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fm-journal-desktop
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: x64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: windows-2025, os: win, arch: x64}
          - {runner: windows-11-arm, os: win, arch: arm64}
          - {runner: macos-15-intel, os: mac, arch: x64}
          - {runner: macos-15, os: mac, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Fetch pinned Electron runtime
        run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run icons
      - run: npm run build
      - name: Package Windows and Linux
        if: runner.os != 'macOS'
        run: npm run dist -- --${{ matrix.os }} --${{ matrix.arch }} --publish never
      - name: Build and seal the Mac application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          npm run dist -- --mac --${{ matrix.arch }} --dir --publish never -c.mac.notarize=false -c.mac.identity=-
          APP=$(find release -maxdepth 2 -name '*.app' -print -quit)
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | tee release/signature-${{ matrix.arch }}.txt
          STAGE=$(mktemp -d)
          ditto "$APP" "$STAGE/Cohnsoft Journal.app"
          ln -s /Applications "$STAGE/Applications"
          DMG="release/FMJournal-mac-${{ matrix.arch }}.dmg"
          hdiutil create -volname 'Cohnsoft Journal' -srcfolder "$STAGE" -format UDZO "$DMG"
          hdiutil verify "$DMG"
          MOUNT=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$DMG"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/Cohnsoft Journal.app"
          hdiutil detach "$MOUNT"
          rm -rf "$STAGE"
      - name: Smoke-test Windows
        timeout-minutes: 2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Recurse -Filter 'Cohnsoft Journal.exe' | Where-Object {$_.DirectoryName -match 'unpacked'} | Select-Object -First 1
          if (!$exe) { throw 'Packaged app missing' }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Offline app smoke test failed' }
      - name: Smoke-test macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find release -maxdepth 2 -name '*.app' -print -quit)
          "$APP/Contents/MacOS/Cohnsoft Journal" --smoke-test
      - name: Smoke-test Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64
          xvfb-run -a release/linux-${{ matrix.arch == 'arm64' && 'arm64-' || '' }}unpacked/fm-journal --no-sandbox --smoke-test
      - name: Collect installers and checksums
        shell: bash
        run: node scripts/collect-release.mjs ${{ matrix.os }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}-${{ matrix.arch }}
          path: release-files/*
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-files
      - name: Require all six platforms
        run: |
          for f in FMJournal-win-x64.exe FMJournal-win-arm64.exe FMJournal-mac-x64.dmg FMJournal-mac-arm64.dmg FMJournal-linux-x64.AppImage FMJournal-linux-arm64.AppImage; do
            test -s "release-files/$f"
            (cd release-files && sha256sum -c "$f.sha256")
          done
      - name: Publish verified early-access installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="desktop-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release already exists; bump the version instead of replacing installers." >&2; exit 1; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Cohnsoft Journal ${VERSION} · Cohnsoft" --notes-file desktop/RELEASE-NOTES.md
          gh release upload "$TAG" release-files/*
